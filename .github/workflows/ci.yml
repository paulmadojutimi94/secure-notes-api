name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Tests (a skipped test fails the build; see POSTMORTEM.md)
        run: |
          pytest -q -rs | tee pytest.log
          if grep -q "skipped" pytest.log; then echo "::error::Tests were skipped"; exit 1; fi
      - name: Eval report (hard numbers)
        if: matrix.python-version == '3.12'
        run: python scripts/eval.py | tee -a "$GITHUB_STEP_SUMMARY"
